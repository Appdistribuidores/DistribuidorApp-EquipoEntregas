<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Entregadores - Distribuidora JF (Oscuro)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<!-- FONDO NEGRO Y TEXTO BLANCO -->
<body class="bg-black min-h-screen text-gray-100 font-sans">

    <!-- Encabezado Gris Oscuro -->
    <header class="bg-gray-900 text-white p-4 shadow-md flex justify-between items-center border-b border-gray-700">
        <div>
            <h1 class="font-bold text-lg">Distribuidora JF</h1>
            <p class="text-xs text-gray-400">Módulo de Entregas</p>
        </div>
        <span id="gps-status" class="text-xs bg-red-600 text-white px-2 py-1 rounded-full">GPS Inactivo</span>
    </header>

    <main class="p-4 max-w-md mx-auto">
        <!-- Selector de Conductor - Recuadro Gris Medio -->
        <div id="section-login" class="bg-gray-800 p-4 rounded-lg shadow-lg mb-4 border border-gray-700">
            <label class="block text-sm font-medium text-gray-300 mb-2">Selecciona tu Nombre:</label>
            <!-- Selector Gris Claro con texto negro para legibilidad -->
            <select id="select-entregador" class="w-full bg-gray-200 text-gray-900 rounded-lg p-2.5 border border-gray-600 mb-3 text-sm focus:ring-blue-500 focus:border-blue-500">
                <option value="">Cargando conductores...</option>
            </select>
            <button onclick="cargarRuta()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition text-sm shadow-md">
                Ver Mi Ruta Del Día
            </button>
        </div>

        <!-- Lista de Pedidos -->
        <div id="section-pedidos" class="hidden">
            <h2 class="font-bold text-gray-300 mb-3 flex justify-between items-center text-sm">
                <span>Mis Pedidos</span>
                <span id="total-pedidos" class="text-xs bg-gray-700 text-gray-100 px-2 py-1 rounded">0</span>
            </h2>
            <div id="lista-pedidos" class="space-y-3">
                <!-- Se puebla dinámicamente con estilo oscuro -->
            </div>
        </div>

        <!-- Modal de Confirmación de Entrega - Fondo Gris Muy Oscuro -->
        <div id="modal-entrega" class="hidden fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4 z-50">
            <div class="bg-gray-900 rounded-lg p-5 w-full max-w-md max-h-[90vh] overflow-y-auto border border-gray-700 shadow-xl">
                <h3 class="font-bold text-lg mb-1 text-white" id="modal-cliente">Reportar Entrega</h3>
                <p class="text-xs text-gray-400 mb-4" id="modal-factura"></p>

                <!-- Restricción de Cámara -->
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-300 mb-1.5">Foto Obligatoria (En vivo):</label>
                    <input type="file" id="foto-input" accept="image/*" capture="environment" class="w-full text-xs text-gray-300 bg-gray-800 border border-gray-600 p-2 rounded-lg file:mr-3 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-gray-600 file:text-white hover:file:bg-gray-500">
                    <p class="text-[10px] text-gray-500 mt-1.5">* Bloqueado el uso de imágenes de la galería.</p>
                </div>

                <!-- Estado de la visita -->
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-300 mb-1.5">Resultado de la visita:</label>
                    <select id="estado-select" class="w-full bg-gray-800 text-gray-100 border border-gray-600 text-sm rounded-lg p-2.5">
                        <option value="entregado">Entrega Completa</option>
                        <option value="entregado_parcial">Entrega Parcial (Novedad)</option>
                        <option value="rechazado">Entrega Rechazada</option>
                        <option value="cliente_cerrado">Cliente Cerrado</option>
                        <option value="sin_dinero">Cliente Sin Dinero</option>
                        <option value="no_realizado">Pedido No Realizado por Cliente</option>
                        <option value="otro">Otro Motivo</option>
                    </select>
                </div>

                <!-- Comentarios / Novedades -->
                <div class="mb-5">
                    <label class="block text-xs font-semibold text-gray-300 mb-1.5">Notas / Observaciones:</label>
                    <textarea id="comentarios-input" rows="3" class="w-full bg-gray-800 text-gray-100 border border-gray-600 rounded-lg p-2.5 text-sm" placeholder="Detalle cualquier observación..."></textarea>
                </div>

                <!-- Botones de Acción -->
                <div class="flex space-x-3">
                    <button onclick="cerrarModal()" class="w-1/2 bg-gray-700 hover:bg-gray-600 text-gray-100 py-2.5 rounded-lg font-semibold text-sm transition">Cancelar</button>
                    <button onclick="guardarEvidencia()" class="w-1/2 bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-lg font-semibold text-sm transition shadow-md">Guardar y Confirmar</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Configuración y Lógica Supabase -->
    <script>
        // !!! CONFIGURA TUS CREDENCIALES DE SUPABASE AQUÍ !!!
        const SUPABASE_URL = 'https://vthocrcgkblewyanmxyq.supabase.co'; // TU URL REAL
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0aG9jcmNna2JsZXd5YW5teHlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MjUyNTAsImV4cCI6MjEwNzAwMTI1MH0.KKReebandReParmKHRxyDJya5i3iSQBaDXlfKhlK_jc'; // TU KEY ANON REAL
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let posActual = null;
        let pedidoSeleccionado = null;

        // Inicializar GPS
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    posActual = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    document.getElementById('gps-status').innerText = 'GPS Activo';
                    document.getElementById('gps-status').className = 'text-xs bg-green-600 text-white px-2 py-1 rounded-full shadow';
                },
                (err) => {
                    document.getElementById('gps-status').innerText = 'GPS Error';
                    document.getElementById('gps-status').className = 'text-xs bg-red-600 text-white px-2 py-1 rounded-full shadow';
                },
                { enableHighAccuracy: true }
            );
        }

        // Cargar Lista de Conductores al Iniciar
        async function cargarEntregadores() {
            const { data, error } = await _supabase.from('entregadores').select('*');
            if (data) {
                const select = document.getElementById('select-entregador');
                select.innerHTML = '<option value="">-- Selecciona tu nombre --</option>';
                data.forEach(e => {
                    select.innerHTML += `<option value="${e.id}">${e.nombre_completo}</option>`;
                });
            } else {
                alert('Error cargando conductores. Verifica credenciales.');
            }
        }

        async function cargarRuta() {
            const entregadorId = document.getElementById('select-entregador').value;
            if (!entregadorId) return alert('Por favor selecciona un conductor');

            const { data: pedidos, error } = await _supabase
                .from('pedidos')
                .select('*')
                .or(`entregador_id.eq.${entregadorId},entregador_id.is.null`)
                .order('prioritario', { ascending: false });

            const contenedor = document.getElementById('lista-pedidos');
            contenedor.innerHTML = '';
            document.getElementById('section-pedidos').classList.remove('hidden');

            if (pedidos && pedidos.length > 0) {
                document.getElementById('total-pedidos').innerText = pedidos.length;
                pedidos.forEach(p => {
                    // Tarjetas de pedido oscuras con borde lateral de estado
                    contenedor.innerHTML += `
                        <div class="bg-gray-800 p-4 rounded-lg shadow-md border border-gray-700 border-l-4 ${p.estado === 'entregado' ? 'border-l-green-500' : (p.prioritario ? 'border-l-yellow-500' : 'border-l-blue-500')}">
                            <div class="flex justify-between items-start mb-1.5">
                                <h4 class="font-bold text-white text-sm">${p.nombre_cliente}</h4>
                                <span class="text-[10px] bg-gray-700 text-gray-200 font-semibold px-2 py-0.5 rounded">${p.numero_factura}</span>
                            </div>
                            <p class="text-xs text-gray-400 mb-2.5">📍 ${p.direccion_entrega}</p>
                            <div class="flex justify-between items-center text-xs text-gray-300 bg-gray-900 p-2 rounded-md mb-3 border border-gray-700">
                                <span>Valor: <b class="text-white">$${Number(p.valor_total).toLocaleString('es-CO')}</b></span>
                                <span>Cajas: <b class="text-white">${p.total_cajas}</b></span>
                            </div>
                            
                            <button onclick='abrirModal(${JSON.stringify(p)})' class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 rounded-lg transition shadow">
                                Reportar Entrega / Visita
                            </button>
                        </div>
                    `;
                });
            } else {
                contenedor.innerHTML = '<p class="text-center text-sm text-gray-500 py-6">No hay pedidos asignados para hoy.</p>';
            }
        }

        function abrirModal(pedido) {
            pedidoSeleccionado = pedido;
            document.getElementById('modal-cliente').innerText = pedido.nombre_cliente;
            document.getElementById('modal-factura').innerText = `Factura: ${pedido.numero_factura}`;
            document.getElementById('modal-entrega').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('modal-entrega').classList.add('hidden');
            pedidoSeleccionado = null;
        }

        async function guardarEvidencia() {
            if (!posActual) {
                return alert('⚠️ Error: Se requiere la ubicación GPS activa para poder guardar el reporte.');
            }

            const fotoInput = document.getElementById('foto-input');
            if (fotoInput.files.length === 0) {
                return alert('📸 Debes tomar una fotografía en vivo para confirmar.');
            }

            const estado = document.getElementById('estado-select').value;
            const comentarios = document.getElementById('comentarios-input').value;

            // Actualizar estado del pedido en Supabase
            const { error: errorPedido } = await _supabase
                .from('pedidos')
                .update({ estado: estado, novedad_detalle: comentarios, updated_at: new Date() })
                .eq('id', pedidoSeleccionado.id);

            if (!errorPedido) {
                alert('✅ Entrega reportada con éxito.');
                cerrarModal();
                cargarRuta();
            } else {
                alert('Ocurrió un error al guardar el reporte en la base de datos.');
            }
        }

        window.onload = cargarEntregadores;
    </script>
</body>
</html>
